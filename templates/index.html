<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitch Task</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main>
        <header>
            <h1>GLITCH TASK</h1>
            <p>Administrador de tareas</p>
        </header>

        <section class="add-task">
            <form action="{{ url_for('add_task') }}" method="POST">
                <input type="text" name="tarea" placeholder="nueva tarea..." required>
                <button type="submit">Agregar</button>
            </form>
        </section>

        <section class="search-task">
            <form action="{{ url_for('home') }}" method="GET">
                <input type="text" name="q" placeholder="Buscar tarea..." value="{{ busqueda }}">
                <button type="submit">Buscar</button>
            </form>
        </section>

        <section class="tasks">
            <h2>Tareas</h2>
            <ul>
                {% for task in tasks %}
                <li data-id="{{ task[0] }}" class="{% if task[2]==1 %}done{% endif %}">
                    <span class="task-text">
                        {% if task[2] == 1 %}[x] {% else %}[ ] {% endif %}{{ task[1] }}
                    </span>
                    <input class="edit-input" type="text" value="{{ task[1] }}" style="display:none;">
                    
                    <div class="actions">
                        {% if task[2] == 0 %}
                            <form class="action-form" action="{{ url_for('complete_task', task_id=task[0]) }}" method="POST">
                                <button type="submit">Completar</button>
                            </form>
                        {% else %}
                            <form class="action-form" action="{{ url_for('unmark_task', task_id=task[0]) }}" method="POST">
                                <button type="submit">Desmarcar</button>
                            </form>
                        {% endif %}
                        <button class="edit-btn">Editar</button>
                        <form class="save-form" action="{{ url_for('edit_task', task_id=task[0]) }}" method="POST" style="display:none;">
                            <input type="hidden" name="tarea" class="hidden-save-input">
                            <button type="submit">Guardar</button>
                        </form>
                        <form class="delete-form action-form" action="{{ url_for('delete_task', task_id=task[0]) }}" method="POST">
                            <button type="submit">Eliminar</button>
                        </form>
                    </div>
                </li>
                {% endfor %}
            </ul>
        </section>

        <section class="progress">
            <h2>Progreso</h2>
            <p>{{ completadas }} / {{ total }} - {{ "%.1f"|format(progreso) }}%</p>
            <div class="progress-container">
                <div class="progress-bar" style="width: {{ progreso }}%"></div>
            </div>
        </section>
    </main>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
